<div class="container">

  <!-- HEADER -->
  <header class="header" [class.header--compact]="state.isLoggedIn">

    <div class="header__inner">
      <div class="header__left">
        <div class="header__eyebrow">
          <span class="tag tag--red">WaniKani</span>
          <span class="tag tag--gold">BETA</span>
        </div>
        <a routerLink="/" class="header__title-link">
          <h1 class="header__title">MY<span class="header__title--accent">漢字</span></h1>
        </a>
        <p class="header__sub">千里の道も一歩から</p>
      </div>

      <!-- NAV — only shows when logged in -->
      @if (state.isLoggedIn) {
        <nav class="nav">
          <!-- Hamburger button -->
          <button class="nav__toggle" (click)="toggleMenu()">
            <span class="nav__toggle-line"></span>
            <span class="nav__toggle-line"></span>
            <span class="nav__toggle-line"></span>
          </button>

          <!-- Menu -->
          <div class="nav__menu" [class.nav__menu--open]="menuOpen">
            <a routerLink="/"
               routerLinkActive="nav__link--active"
               [routerLinkActiveOptions]="{exact: true}"
               class="nav__link"
               (click)="closeMenu()">
              統計 STATS
            </a>
            <a routerLink="/levels"
               routerLinkActive="nav__link--active"
               class="nav__link"
               (click)="closeMenu()">
              級 LEVELS
            </a>
          </div>
        </nav>
      }
    </div>

  </header>

  <!-- PAGE CONTENT -->
  <main>
    <router-outlet />
  </main>

</div>
